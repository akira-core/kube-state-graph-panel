# Local demo — ONE Grafana, ONE dashboard, no backend anywhere.
#
# `KSG Showcase` (/d/ksg-switch-demo) carries its whole graph in an Infinity INLINE
# target, generated from src/shared/fixtures/showcaseGraph.ts by `npm run fixture:build`.
# Nothing here talks to a kube-state-graph server, a Prometheus-compatible store, or a
# Kubernetes cluster: this repository is panel-only, and its demo data is a typed fixture.
#
#   npm run build          # or `npm run dev` to keep webpack watching
#   docker compose up -d   # → http://localhost:3000/d/ksg-switch-demo
#
# Grafana runs with anonymous auth in dev and loads the plugin from the dist/ bind mount,
# so a rebuild is picked up on browser reload with no container restart.
services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    environment:
      # Auto-install the Infinity datasource plugin so the provisioned ksg-default
      # datasource has a backing plugin. Without this, Grafana shows
      # "Datasource ksg-default was not found" and the inline target never parses.
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    volumes:
      # Persist installed plugins so GF_INSTALL_PLUGINS doesn't re-download them on every
      # `docker compose up`. The dist/ bind mount from the base config targets a
      # subdirectory of this path and is layered on top, so the local plugin still wins.
      - ksg-grafana-plugins:/var/lib/grafana/plugins

volumes:
  ksg-grafana-plugins:
