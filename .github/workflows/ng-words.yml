name: NG Words

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check:
    name: Check NG words
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: akira-core/action-workflow@v1
        with:
          ng-words: ${{ secrets.NG_WORDS }}
