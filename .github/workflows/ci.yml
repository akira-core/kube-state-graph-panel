name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Sign plugin
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' }}
        run: npm run sign

      - name: Validate plugin metadata
        run: |
          sudo apt-get install -y jq
          PLUGIN_ID=$(jq -r .id dist/plugin.json)
          PLUGIN_VERSION=$(jq -r .info.version dist/plugin.json)
          ARCHIVE="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"
          mv dist "${PLUGIN_ID}"
          zip -r "${ARCHIVE}" "${PLUGIN_ID}"
          docker run --pull=always \
            -v "$PWD/${ARCHIVE}:/archive.zip" \
            grafana/plugin-validator-cli -analyzer=metadatavalid /archive.zip
          echo "PLUGIN_ID=${PLUGIN_ID}" >> $GITHUB_ENV
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_ID }}
          path: ${{ env.PLUGIN_ID }}
          retention-days: 5
