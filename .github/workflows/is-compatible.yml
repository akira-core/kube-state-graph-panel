name: Grafana 11.4 API compatibility check
on: [pull_request]

jobs:
  compatibilitycheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `comment-pr: 'yes'` below posts the Levitate report as a sticky PR
      # comment via the GitHub issue-comments API, which needs write access to
      # pull requests. Without this the step 403s ("Resource not accessible by
      # integration") and fails the job even though `fail-if-incompatible: 'no'`.
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Find module.ts or module.tsx
        id: find-module-ts
        run: |
          MODULETS="$(find ./src -type f \( -name "module.ts" -o -name "module.tsx" \))"
          echo "modulets=${MODULETS}" >> $GITHUB_OUTPUT

      - name: Compatibility check
        uses: grafana/plugin-actions/is-compatible@is-compatible/v1.0.2
        with:
          module: ${{ steps.find-module-ts.outputs.modulets }}
          # Check against the MINIMUM supported Grafana (grafanaDependency ">=11.4.0")
          # rather than the action's default @latest. Levitate compares the installed
          # @grafana/* (12.4.x) against these targets, so pinning to 11.4.0 surfaces any
          # API we use that does NOT exist in 11.4 and would break on the min version.
          # Only the packages src/ actually imports (data / ui / runtime).
          targets: '@grafana/data@11.4.0,@grafana/ui@11.4.0,@grafana/runtime@11.4.0'
          comment-pr: 'yes'
          fail-if-incompatible: 'no'
