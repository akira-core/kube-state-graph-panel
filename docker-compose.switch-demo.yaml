# Backend-free SHOWCASE demo of the panel.
#
# Runs ONLY Grafana with the panel — no kube-state-graph / VictoriaMetrics /
# seeder. A single self-contained topology is embedded in the dashboard
# `provisioning/dashboards/ksg-switch-demo.json` as an Infinity **inline** target,
# so the whole panel can be exercised with zero backend.
#
# The fixture deliberately covers everything the panel can render today:
#   - all 6 node kinds with backend relationships: pod / node / pvc / service /
#     external / switch  (workload controllers are intentionally omitted — they
#     have no drawn edge/nesting yet, see icon-encoding-workload-topology)
#   - all 6 drawn edge types: switch-to-switch, node-to-switch, service-selects-pod,
#     pod-mounts-pvc, pod-calls-service, pod-calls-pod (incl. one cross-cluster)
#   - 3-tier switch fabric pinned by labels.level (readSwitchLevels ->
#     buildSwitchConstraints), two cluster compound containers + K8s node nesting
#   - node status colours (normal/warning/critical), clickable alerts (time-rewind),
#     hover-tooltip labels, the node detail panel, cluster/node collapse, the
#     pod-parent (node<->service) mode toggle, and the kind/edge element filter
#
#   npm run build                                       # produce dist/
#   docker compose -f docker-compose.switch-demo.yaml up
#   open http://localhost:3000/d/ksg-switch-demo
#
# Note: the other provisioned dashboard (KSG Demo) still points at the backend and
# will show a datasource error here — that is expected; open "KSG Showcase".
services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    # No depends_on: this demo needs no backend container.
    environment:
      # Infinity backs the provisioned ksg-default datasource; the inline target
      # needs the plugin present but never calls its URL.
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    volumes:
      # Persist the installed plugin across restarts (same pattern as the full demo).
      - ksg-grafana-plugins:/var/lib/grafana/plugins

volumes:
  ksg-grafana-plugins:
